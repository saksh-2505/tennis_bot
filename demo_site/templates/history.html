<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet History</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans">
    <nav class="bg-gray-800 border-b border-gray-700 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-green-500">🎾 AI Tennis Demo</h1>
            <div class="space-x-4">
                <a href="/" class="hover:text-green-400">Live Odds</a>
                <a href="/history" class="hover:text-green-400">Bet History</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6">
        <h2 class="text-3xl font-bold mb-6">Demo Bet History</h2>
        
        <div class="bg-gray-800 border border-gray-700 rounded-2xl overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-700 text-gray-400 uppercase text-xs">
                    <tr>
                        <th class="p-4">Date</th>
                        <th class="p-4">Match</th>
                        <th class="p-4">Wager</th>
                        <th class="p-4">Odds</th>
                        <th class="p-4">Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                    {% for bet in bets %}
                    <tr class="hover:bg-gray-750">
                        <td class="p-4">{{ bet.created_at }}</td>
                        <td class="p-4 font-bold">{{ bet.player_a }} vs {{ bet.player_b }}</td>
                        <td class="p-4">${{ bet.amount_wagered }}</td>
                        <td class="p-4">{{ bet.odds_taken }}</td>
                        <td class="p-4">
                            <span class="px-3 py-1 rounded-full text-xs font-bold 
                                {% if bet.status == 'won' %}bg-green-900 text-green-400
                                {% elif bet.status == 'lost' %}bg-red-900 text-red-400
                                {% else %}bg-blue-900 text-blue-400{% endif %}">
                                {{ bet.status | upper }}
                            </span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
